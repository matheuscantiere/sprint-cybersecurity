upstream fordspy_backend {
    server web:8000;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name _;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;
    server_tokens off;

    # Mount TLS certificates via docker secret / volume at deploy time
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Allow Django middleware to handle oversized payloads and return JSON 413
    client_max_body_size 10m;

    location / {
        proxy_pass http://fordspy_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Suppress upstream stack disclosure
        proxy_hide_header Server;
        add_header Server "fordspy" always;
    }
}
