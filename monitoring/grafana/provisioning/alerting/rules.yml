apiVersion: 1

groups:
  - orgId: 1
    name: fordspy-alerts
    folder: FordSpy
    interval: 1m
    rules:
      - uid: fordspy-high-429-5xx
        title: High 429/5xx rate
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus_ds
            model:
              refId: A
              expr: >-
                100 * sum(rate(django_http_responses_total_by_status_total{status=~"429|5.."}[5m]))
                / sum(rate(django_http_responses_total_by_status_total[5m]))
              instant: true
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [5]
        labels:
          severity: warning
        annotations:
          summary: "Taxa de respostas 429/5xx acima de 5% nos últimos 5min — ver Spec 3, plano de resposta a incidentes."
