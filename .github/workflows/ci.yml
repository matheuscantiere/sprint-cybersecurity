name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  DJANGO_SETTINGS_MODULE: config.settings.dev
  DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
  JWT_SIGNING_KEY: ci-only-jwt-signing-key-not-for-production
  CRYPTOGRAPHY_KEY: REDACTED-CI-KEY
  DATABASE_URL: postgres://fordspy:fordspy@localhost:5432/fordspy

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: make lint

  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: semgrep/semgrep-action@v1
        with:
          config: p/owasp-top-ten p/python p/django

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt

  test:
    runs-on: ubuntu-latest
    needs: [lint, sast, secrets, sca]
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fordspy
          POSTGRES_PASSWORD: fordspy
          POSTGRES_DB: fordspy
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: make cov
      - run: make check

  container:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fordspy:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: fordspy:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
